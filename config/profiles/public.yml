        archival: true
        request_budget:
          requests_per_second: 5
          burst: 5
        capabilities:
          unsupported_methods: ["eth_protocolVersion"]
          limits:
            max_block_range: 98

      - id: "base_blockreq"
        name: "BlockReq Base"
        priority: 8
        url: "https://base-rpc.blockreq.com/v1/rpc/public"
        archival: false
        request_budget:
          requests_per_second: 5
          burst: 5
        capabilities:
          limits:
            max_block_range: 256

      - id: "base_thirdweb"
