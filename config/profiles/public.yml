      size: md

    # archival: true marks endpoints that served state at block 1 in two
    # separate checks; false marks endpoints with pruned history.
    providers:
      # Served every log span we measured, so no range limit is declared.
      - id: "tempo_tempo"
        name: "Tempo"
        priority: 2
        url: "https://rpc.mainnet.tempo.xyz"
        ws_url: "wss://rpc.mainnet.tempo.xyz"
        subscribe_new_heads: true
        archival: true

      - id: "tempo_drpc"
        name: "dRPC Tempo"
        priority: 3
        url: "https://tempo.drpc.org"
        archival: true
        capabilities:
          limits:
            max_block_range: 98

      # Serves recent blocks only: state reads 64 blocks behind the head worked
      # and 100 blocks back were refused as archive requests.
      - id: "tempo_publicnode"
        name: "PublicNode Tempo"
        priority: 4
        url: "https://tempo-rpc.publicnode.com"
        ws_url: "wss://tempo-rpc.publicnode.com"
        subscribe_new_heads: true
        archival: false
        capabilities:
          unsupported_categories: [debug, trace, txpool, filters]
          limits:
            max_block_age: 64
            block_age_methods:
              [
                eth_call,
                eth_getBalance,
                eth_getCode,
                eth_getStorageAt,
                eth_getTransactionCount,
              ]

