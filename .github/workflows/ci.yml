name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ["1.18.4"]
        otp: ["28.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('**/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Audit dependencies
        run: mix hex.audit

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Verify container publication guards
        run: python3 -m unittest discover -s scripts/distribution -p "test_*.py"

  integration:
    name: Hermetic Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LASSO_TEST_PUBLICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lasso_publication_test
      LASSO_QUERY_EVIDENCE_PATH: logical-read-evidence.json
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lasso_publication_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('**/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-integration-28.0-1.18.4-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-integration-28.0-1.18.4-

      - name: Install dependencies
        run: mix deps.get

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Verify logical-read client and install fixture dependencies
        run: |
          anvil --version
          node --test examples/published-block-query.test.mjs
          npm ci --prefix examples/logical-read --ignore-scripts --no-audit --no-fund
          npm test --prefix examples/logical-read

      - name: Run hermetic integration and publication recovery tests
        run: mix test --include integration --include publication_db --include anvil

      - name: Validate correlated logical-read response evidence
        run: node examples/logical-read/verify-evidence.mjs logical-read-evidence.json

      - name: Preserve logical-read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logical-read-evidence
          path: logical-read-evidence.json
          if-no-files-found: error

  lint:
    name: Lint (Credo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('**/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-dev-28.0-1.18.4-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-dev-28.0-1.18.4-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run Credo
        run: mix credo --strict

  dialyzer:
    name: Dialyzer (Type Checking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('**/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-dev-28.0-1.18.4-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-dev-28.0-1.18.4-

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-28.0-1.18.4-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-28.0-1.18.4-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Create PLT directory
        run: mkdir -p priv/plts

      - name: Run Dialyzer
        run: mix dialyzer --format github

  docker:
    name: Docker build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image from clean context
        run: docker build --pull --no-cache --tag lasso-rpc:ci .

      - name: Boot image and verify health
        shell: bash
        run: |
          set -euo pipefail
          secret_key_base="$(openssl rand -hex 64)"
          docker run --detach --name lasso-rpc-ci --publish 4000:4000 \
            --env LASSO_NODE_ID=ci \
            --env PHX_HOST=localhost \
            --env PHX_SCHEME=http \
            --env SECRET_KEY_BASE="$secret_key_base" \
            lasso-rpc:ci

          trap 'docker logs lasso-rpc-ci || true; docker rm --force lasso-rpc-ci >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Container did not become healthy within 60 seconds" >&2
          exit 1
