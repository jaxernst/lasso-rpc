# Put this file in nginx's conf.d directory. Lasso must listen only on
# 127.0.0.1:4000; replace the hostname, certificate paths and password file.
map $http_upgrade $lasso_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name rpc.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rpc.example.com;

    ssl_certificate /etc/letsencrypt/live/rpc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.example.com/privkey.pem;

    # Applies to RPC, dashboard, readiness, and metrics. Configure the
    # Prometheus scraper with these credentials or isolate /metrics privately.
    auth_basic "Lasso Core";
    auth_basic_user_file /etc/nginx/lasso.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lasso_connection_upgrade;
        proxy_read_timeout 7500s;
    }
}
